server:
  port: 8181

# dev = header User-ID diterima tanpa token (hanya untuk testing lokal)
app:
  mode: ${APP_MODE:final}

jwt:
  secret: ${JWT_SECRET}

camunda.bpm.admin-user:
  id: ${CAMUNDA_ADMIN_USER:admin}
  password: ${CAMUNDA_ADMIN_PASSWORD}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manajemen_pa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    prefix: classpath:email/
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

storage:
  url: ${MINIO_URL:http://localhost:9000}
  user: ${MINIO_ACCESS_KEY}
  password: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:proyek-akhir}
